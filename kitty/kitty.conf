# Kitty Configuration
# Generated based on Alacritty/Zellij setup

# ===== Font Configuration =====
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# ===== Color Scheme (Dracula) =====
# Based on your Alacritty Dracula theme

# Foreground and background
foreground #f8f8f2
background #282a36

# Cursor colors
cursor #f8f8f2
cursor_text_color #282a36

# Selection colors
selection_foreground #44475a
selection_background #f8f8f2

# Black
color0 #21222c
color8 #6272a4

# Red
color1 #ff5555
color9 #ff6e6e

# Green
color2  #50fa7b
color10 #69ff94

# Yellow
color3  #f1fa8c
color11 #ffffa5

# Blue
color4  #bd93f9
color12 #d6acff

# Magenta
color5  #ff79c6
color13 #ff92df

# Cyan
color6  #8be9fd
color14 #a4ffff

# White
color7  #f8f8f2
color15 #ffffff

# ===== Window Settings =====
window_padding_width 0
initial_window_width  640
initial_window_height 400
remember_window_size  yes
enabled_layouts splits,stack

# Window decorations
hide_window_decorations no

# Tab bar - hide since you don't use tabs
tab_bar_style hidden

# ===== Scrollback =====
scrollback_lines 100000

# ===== Shell Configuration =====
shell bash
env IS_NVIM=no

# ===== Bell Configuration =====
enable_audio_bell no
visual_bell_duration 0.0

# ===== Remote Control for smart-splits integration =====
# For Linux:
allow_remote_control yes
listen_on unix:@mykitty

# For other Unix systems, use instead:
# allow_remote_control yes
# listen_on unix:/tmp/mykitty

# ===== Keyboard Shortcuts =====
# Clear default shortcuts
clear_all_shortcuts yes

# ===== Clipboard =====
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# ===== Window/Pane Management (matching your Zellij keybinds) =====

# Ctrl+Shift+F - Search in scrollback and scroll to selection
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting fzf --ansi --no-sort --no-mouse --exact -i --tac

map ctrl+s>e kitten scroll_and_edit.py

# Ctrl+Shift+W - Close window/pane (was \uE001)
map ctrl+shift+w close_window

# Ctrl+Shift+X - Toggle fullscreen (was \uE007)
map ctrl+shift+x toggle_layout stack

# Ctrl+Shift+E - New window right/vertical split (was \uE008)
map ctrl+shift+e launch --location=vsplit --cwd=current

# Ctrl+Shift+O - New window down/horizontal split (was \uE009)
map ctrl+shift+o launch --location=hsplit --cwd=current

# ===== Alt-based Navigation (smart-splits integration) =====
# Navigation with Alt+hjkl - works with Neovim via smart-splits
map alt+h neighboring_window left
map alt+j neighboring_window down
map alt+k neighboring_window up
map alt+l neighboring_window right

# Unset mappings when Neovim is focused (pass through to Neovim)
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l

# Navigation with Alt+arrows - works with Neovim via smart-splits
map alt+left neighboring_window left
map alt+down neighboring_window down
map alt+up neighboring_window up
map alt+right neighboring_window right

# Unset mappings when Neovim is focused (pass through to Neovim)
map --when-focus-on var:IS_NVIM alt+left
map --when-focus-on var:IS_NVIM alt+down
map --when-focus-on var:IS_NVIM alt+up
map --when-focus-on var:IS_NVIM alt+right

# ===== Ctrl+Shift+Arrows - Resize windows (was \uE003-\uE006) =====
# Use the smart-splits kitten for resizing
map ctrl+shift+up kitten relative_resize.py up 3
map ctrl+shift+down kitten relative_resize.py down 3
map ctrl+shift+left kitten relative_resize.py left 3
map ctrl+shift+right kitten relative_resize.py right 3

# Unset when Neovim is focused (pass through to Neovim)
map --when-focus-on var:IS_NVIM ctrl+shift+up
map --when-focus-on var:IS_NVIM ctrl+shift+down
map --when-focus-on var:IS_NVIM ctrl+shift+left
map --when-focus-on var:IS_NVIM ctrl+shift+right

# ===== Other Alt shortcuts =====
# Alt + font resize
map alt+plus change_font_size all +1.0
map alt+minus change_font_size all -1.0
map alt+equal change_font_size all +1.0

# Alt + new window/pane
map alt+n launch --location=vsplit --cwd=current

# Alt + stack toggle
map alt+f toggle_layout stack

# ===== Scrollback Navigation =====
map ctrl+page_up scroll_page_up
map ctrl+page_down scroll_page_down

# ===== Font Size =====
map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ===== Miscellaneous =====
map ctrl+shift+f11 toggle_fullscreen
map ctrl+shift+u kitten unicode_input
map ctrl+shift+escape kitty_shell window

# Reload config
map ctrl+shift+f5 load_config_file

# ===== Additional Settings =====
# Cursor
cursor_shape block
cursor_blink_interval 0

# Mouse
mouse_hide_wait 0
url_color #8be9fd
url_style curly

# Performance
repaint_delay 10
input_delay 3
sync_to_monitor yes

# Shell integration
shell_integration enabled

